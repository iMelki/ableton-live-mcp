[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-live-mcp"
version = "0.1.2"
description = "General-purpose MCP bridge for Ableton Live's object model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "Pillow>=10",
    "pydub>=0.25",
    "pyobjc-framework-Quartz; platform_system == 'Darwin'",
    "pyobjc-framework-ScreenCaptureKit; platform_system == 'Darwin'",
    "windows-capture>=2.0; platform_system == 'Windows'",
]
debug = ["pytest>=8.0"]
visual = [
    "Pillow>=10",
    "pyobjc-framework-Quartz; platform_system == 'Darwin'",
    "pyobjc-framework-ScreenCaptureKit; platform_system == 'Darwin'",
    "windows-capture>=2.0; platform_system == 'Windows'",
]
vocals = ["pydub>=0.25", "faster-whisper>=1.0"]

[project.scripts]
ableton-live-mcp = "server:main"
ableton-live-mcp-validate = "validate:main"
ableton-live-mcp-install-remote-script = "install_remote_script:main"
ableton-live-mcp-build-m4l-device = "agent_m4l:main"
ableton-live-mcp-sync-m4l-host = "agent_m4l:sync_host_main"
ableton-live-mcp-capture-window = "visual_capture:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 200
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
# Pyflakes (unused imports/vars, undefined names) and import sorting: both are
# fully mechanical and pass clean without a stylistic rewrite. Pyupgrade (UP) is
# deliberately NOT enabled -- most of its findings here (168 of 187) want to
# rewrite the codebase's consistent, intentional %-style string formatting to
# f-strings, which is a large unrelated stylistic diff, not a mechanical fix.
select = ["F", "I"]

[tool.hatch.build.targets.wheel]
only-include = ["src", "m4l", "scripts"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"Ableton_Live_MCP" = "Ableton_Live_MCP"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/Ableton_Live_MCP",
    "/m4l",
    "/scripts",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
